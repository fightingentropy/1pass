<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Example eVisa immigration status</title>
  <desc id="desc">Illustration of an immigration status summary for Syrja Hoxha.</desc>
  <rect width="100%" height="100%" fill="#f3f2f1" />
  <rect x="60" y="50" width="840" height="440" rx="12" ry="12" fill="#ffffff" stroke="#d8d7d6" stroke-width="2" />
  <text x="90" y="110" font-family="'Arial', 'Helvetica', sans-serif" font-size="42" font-weight="700" fill="#0b0c0c">Your immigration status</text>
  <text x="90" y="150" font-family="'Arial', 'Helvetica', sans-serif" font-size="34" font-weight="700" fill="#0b0c0c">(eVisa)</text>
  <line x1="90" y1="170" x2="770" y2="170" stroke="#b1b4b6" stroke-width="1.5" />

  <g font-family="'Arial', 'Helvetica', sans-serif" font-size="26" fill="#0b0c0c" font-weight="700">
    <text x="90" y="225">Name</text>
    <text x="90" y="285">Date of birth</text>
    <text x="90" y="345">Nationality</text>
    <text x="90" y="405">Status</text>
    <text x="90" y="465">Valid until</text>
  </g>

  <g font-family="'Arial', 'Helvetica', sans-serif" font-size="26" fill="#0b0c0c">
    <text x="280" y="225" font-weight="700">SYRJA HOXHA</text>
    <text x="280" y="285">11 June 1967</text>
    <text x="280" y="345">ALB</text>
    <foreignObject x="280" y="355" width="420" height="120">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Arial, Helvetica, sans-serif; font-size: 26px; color: #0b0c0c;">
        Pre-settled status, also known as limited leave to remain
      </div>
    </foreignObject>
    <text x="280" y="465">20 October 2030</text>
  </g>

  <rect x="700" y="200" width="160" height="220" fill="#d2d0cd" stroke="#b1b4b6" stroke-width="1.5" rx="4" ry="4" />
  <text x="780" y="330" text-anchor="middle" font-family="'Arial', 'Helvetica', sans-serif" font-size="22" fill="#505a5f">Photo</text>
  <text x="780" y="360" text-anchor="middle" font-family="'Arial', 'Helvetica', sans-serif" font-size="18" fill="#6f777b">not available</text>
</svg>

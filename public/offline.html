<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1Pass Vault – Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2.5rem 1.5rem;
        background: radial-gradient(circle at top, rgba(79, 70, 229, 0.12), transparent 65%),
          linear-gradient(180deg, rgba(9, 9, 11, 0.92), rgba(9, 9, 11, 0.96));
        color: rgba(255, 255, 255, 0.9);
      }
      main {
        max-width: 22rem;
        text-align: center;
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 1.25rem;
        padding: 2.25rem 2rem;
        backdrop-filter: blur(18px);
        box-shadow: 0 32px 48px rgba(15, 23, 42, 0.35);
      }
      h1 {
        font-size: 1.65rem;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
        line-height: 1.6;
      }
      button {
        font-size: 0.95rem;
        border-radius: 999px;
        padding: 0.75rem 1.75rem;
        border: none;
        background: rgb(129, 140, 248);
        color: rgb(15, 23, 42);
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline for now</h1>
      <p>The 1Pass Vault app needs a connection to encrypt and sync changes. You can keep browsing your saved items once you are back online.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
